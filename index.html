<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeoAI - المساعد الذكي والمرح</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js لتحويل النصوص والأكواد -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0fdf4; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1.5rem; border-radius: 0.75rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; direction: ltr; text-align: left;}
        .markdown-body code { font-family: monospace; font-size: 0.9em; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .slide-transition { transition: opacity 0.3s ease-in-out; }
        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* تأثير النبض لمؤشر الكتابة */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-green-100 p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-3xl font-extrabold text-green-600 tracking-tight">✨ KeoAI</h1>
            <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold shadow-sm hidden sm:inline-block">بواسطة كريم حسين</span>
        </div>
        <div id="auth-container">
            <button id="login-btn-top" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold transition shadow-md text-sm md:text-base flex items-center gap-2">
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                <span class="hidden sm:inline">تسجيل الدخول للحفظ</span>
                <span class="sm:hidden">دخول</span>
            </button>
        </div>
    </header>

    <!-- منطقة التنبيه للزوار -->
    <div id="guest-banner" class="bg-yellow-50 text-yellow-800 text-sm font-semibold text-center py-2 border-b border-yellow-200 shadow-sm transition-all">
        ⚠️ أنت تستخدم كيو كزائر. الدردشات لن تحفظ عند تحديث الصفحة. سجل الدخول لحفظها!
    </div>

    <!-- Main Content Layout -->
    <div class="flex-1 flex w-full h-full overflow-hidden relative">
        
        <!-- القسم الأيمن: الدردشة -->
        <main id="chat-section" class="flex-1 flex flex-col h-full bg-white relative transition-all duration-300 w-full lg:w-1/2 lg:border-l border-gray-200 shadow-xl z-20">
            <!-- مساحة عرض الرسائل -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-50 scroll-smooth">
                <!-- المحادثات ستظهر هنا -->
            </div>

            <!-- منطقة الإدخال -->
            <div class="p-4 bg-white border-t border-gray-200 shadow-[0_-5px_15px_-10px_rgba(0,0,0,0.1)] relative z-30">
                <form id="chat-form" class="flex gap-2 relative">
                    <input type="text" id="user-input" autocomplete="off" placeholder="اطلب من كيو كود أو عرض تقديمي..." class="flex-1 bg-gray-50 p-4 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:bg-white transition-all pr-6 text-gray-800 shadow-inner text-base md:text-lg">
                    <button type="submit" id="send-btn" class="bg-green-500 text-white p-4 rounded-full hover:bg-green-600 transition-colors shadow-md flex items-center justify-center min-w-[60px] transform hover:scale-105 active:scale-95">
                        <svg class="w-6 h-6 transform -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V6m0 0l-7 7m7-7l7 7"></path></svg>
                    </button>
                </form>
            </div>
        </main>

        <!-- القسم الأيسر: العروض التفاعلية -->
        <aside id="interactive-panel" class="hidden absolute lg:relative w-full lg:w-1/2 h-full bg-slate-100 flex-col z-30 transition-transform transform translate-x-full lg:translate-x-0 shadow-[-10px_0_20px_-10px_rgba(0,0,0,0.1)]">
            
            <!-- هيدر الشاشة الجانبية -->
            <div class="bg-slate-800 text-white p-3 flex justify-between items-center shadow-md">
                <div class="flex gap-3">
                    <button id="tab-preview" class="px-4 py-1.5 rounded-full bg-blue-500 hover:bg-blue-600 transition font-bold text-sm hidden shadow-sm">معاينة الكود 💻</button>
                    <button id="tab-presentation" class="px-4 py-1.5 rounded-full bg-purple-500 hover:bg-purple-600 transition font-bold text-sm hidden shadow-sm">العرض التقديمي 📊</button>
                </div>
                <button id="close-panel" class="text-gray-300 hover:text-white p-1.5 bg-slate-700 hover:bg-red-500 transition rounded-full lg:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- حاوية معاينة الكود (Iframe) -->
            <div id="code-preview-container" class="flex-1 bg-white hidden w-full h-full relative">
                <iframe id="preview-iframe" class="w-full h-full border-none bg-white"></iframe>
            </div>

            <!-- حاوية العرض التقديمي -->
            <div id="presentation-container" class="flex-1 bg-gradient-to-br from-slate-900 to-slate-800 hidden flex-col justify-center items-center p-4 md:p-8 relative">
                <div id="slide-content" class="bg-white text-slate-900 p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-2xl min-h-[350px] flex flex-col justify-center text-center markdown-body text-xl md:text-2xl slide-transition border-b-4 border-purple-500">
                    <!-- محتوى الشريحة -->
                </div>
                
                <!-- أزرار التحكم -->
                <div class="absolute bottom-8 flex gap-6 bg-slate-800/90 p-3 rounded-full backdrop-blur-md border border-slate-600 shadow-xl">
                    <button id="prev-slide" class="text-white hover:text-purple-400 font-bold px-4 py-2 disabled:opacity-30 transition">السابق ◀</button>
                    <span id="slide-counter" class="text-gray-300 font-mono font-bold flex items-center text-lg px-2">1 / 1</span>
                    <button id="next-slide" class="text-white hover:text-purple-400 font-bold px-4 py-2 disabled:opacity-30 transition">▶ التالي</button>
                </div>
            </div>
        </aside>

    </div>

    <!-- 스كريبتات التطبيق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyC0lwVRTBPA3yxnZ3wuqvyfQJbJP-AVNJo",
            authDomain: "kareem-8ed77.firebaseapp.com",
            databaseURL: "https://kareem-8ed77-default-rtdb.firebaseio.com",
            projectId: "kareem-8ed77",
            storageBucket: "kareem-8ed77.firebasestorage.app",
            messagingSenderId: "557227389584",
            appId: "1:557227389584:web:f8ffa9c5913ef54c919e15"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // إعدادات Groq
        const GROQ_API_KEY = "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";
        
        // التوجيه الصارم لشخصية كيو
        const SYSTEM_PROMPT = `أنت مساعد ذكي، ودود، ومرح جداً، اسمك "Keo" (كيو).
المبرمج والمطور الذي قام بصناعتك وتطويرك هو المهندس "كريم حسين محمدصلاح". 
ممنوع منعاً باتاً أن تذكر أنك مبني على LLaMA أو أن الشركة المطورة لك هي Groq أو OpenAI. أنت من صنع كريم حسين وفقط.
استخدم الرموز التعبيرية (Emojis) دائماً لتكون مرحاً.

[توجيهات برمجية وعروض تقديمية]:
1. إذا طلب المستخدم كتابة كود لموقع (HTML/CSS/JS)، اكتب كود HTML واحد كامل يحتوي على CSS و JS بداخله. ضعه كله داخل كتلة كود (Code Block) واحدة من نوع html هكذا:
\`\`\`html
<!DOCTYPE html>
<html>...الكود...</html> 
\`\`\`
2. إذا طلب المستخدم "عرض تقديمي" أو "Presentation"، يجب عليك كتابته بالصيغة التالية تماماً:
ابدأ بـ [PRESENTATION_START]
ثم اكتب عنوان الشريحة الأولى والمحتوى، ثم ضع الفاصل [SLIDE_BREAK]
ثم الشريحة الثانية، ثم [SLIDE_BREAK]... وهكذا
في النهاية ضع [PRESENTATION_END]
لا تضع هذه العلامات إلا إذا طلب المستخدم عرضاً تقديمياً.`;

        // المتغيرات
        let currentUser = null;
        let localMessages = [];
        let currentSlides = [];
        let currentSlideIndex = 0;
        let unsubscribeChats = null;

        // عناصر الواجهة
        const authContainer = document.getElementById('auth-container');
        const guestBanner = document.getElementById('guest-banner');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const interactivePanel = document.getElementById('interactive-panel');
        const tabPreview = document.getElementById('tab-preview');
        const tabPresentation = document.getElementById('tab-presentation');
        const codePreviewContainer = document.getElementById('code-preview-container');
        const presentationContainer = document.getElementById('presentation-container');
        const previewIframe = document.getElementById('preview-iframe');
        const slideContent = document.getElementById('slide-content');
        const closePanelBtn = document.getElementById('close-panel');

        const WELCOME_MSG = "أهلاً بيك! 👋 أنا <b>كيو (Keo)</b>، مساعدك الذكي والمرح.<br>صنعني المبدع <b>كريم حسين محمدصلاح</b> عشان أساعدك في أي حاجة!<br>بتحب نكتب كود، نعمل عرض تقديمي، ولا ندردش بس؟ 🚀";

        // إعداد رسالة الترحيب الأولى
        function showWelcomeMessage() {
            chatBox.innerHTML = '';
            addMessageToUI('keo', WELCOME_MSG, false);
        }

        // ------------------ إدارة المصادقة (Auth) ------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                guestBanner.classList.add('hidden');
                authContainer.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold text-gray-700 hidden md:inline">مرحباً، ${user.displayName.split(' ')[0]}</span>
                        <img src="${user.photoURL}" alt="Profile" class="w-9 h-9 rounded-full border-2 border-green-500 shadow-sm">
                        <button id="logout-btn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-1.5 rounded-full text-sm font-bold transition shadow-sm border border-red-200">خروج</button>
                    </div>
                `;
                document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
                
                chatBox.innerHTML = ''; 
                loadChatsFromFirebase();
            } else {
                currentUser = null;
                guestBanner.classList.remove('hidden');
                authContainer.innerHTML = `
                    <button id="login-btn-top" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-semibold transition shadow-md text-sm flex items-center gap-2">
                        تسجيل الدخول للحفظ
                    </button>
                `;
                document.getElementById('login-btn-top').addEventListener('click', () => signInWithPopup(auth, provider));
                if (unsubscribeChats) unsubscribeChats();
                
                chatBox.innerHTML = '';
                if(localMessages.length === 0) {
                     showWelcomeMessage();
                } else {
                    localMessages.forEach(msg => addMessageToUI(msg.sender, msg.text, false));
                }
            }
        });

        // ------------------ الاتصال بقاعدة البيانات ------------------
        function loadChatsFromFirebase() {
            if (!currentUser) return;
            const q = query(collection(db, `users/${currentUser.uid}/chats`), orderBy('createdAt', 'asc'));
            unsubscribeChats = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = ''; 
                if(snapshot.empty) {
                     addMessageToUI('keo', "أهلاً بيك يا غالي! 👋 أنا <b>كيو</b> معاك. بحسابك المسجل ده كل شاتاتنا هتتحفظ هنا. جاهز نبرمج؟", false);
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    addMessageToUI(data.sender, data.text, false);
                });
                scrollToBottom();
            });
        }

        async function saveMessage(sender, text) {
            if (!currentUser) {
                localMessages.push({ sender, text });
                addMessageToUI(sender, text);
            } else {
                addMessageToUI(sender, text); 
                try {
                    await addDoc(collection(db, `users/${currentUser.uid}/chats`), {
                        sender: sender,
                        text: text,
                        createdAt: serverTimestamp()
                    });
                } catch (e) {
                    console.error("Error saving doc", e);
                }
            }
            
            if(sender === 'keo') {
                checkForCodeOrPresentation(text);
            }
        }

        // ------------------ واجهة الدردشة ------------------
        function addMessageToUI(sender, text, scroll = true) {
            const div = document.createElement('div');
            // إضافة خاصية data-role و data-raw-content للحفاظ على النص الأصلي سليم للـ API
            div.setAttribute('data-role', sender === 'user' ? 'user' : 'assistant');
            div.setAttribute('data-raw-content', text);
            
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-4 w-full`;
            
            let bgClass = sender === 'user' 
                ? 'bg-green-500 text-white rounded-br-none shadow-md' 
                : 'bg-white border border-gray-200 text-gray-800 rounded-tr-none shadow-sm markdown-body';
            
            let formattedText = sender === 'keo' ? marked.parse(text) : text;

            div.innerHTML = `<div class="p-4 rounded-2xl max-w-[95%] md:max-w-[85%] ${bgClass} break-words overflow-hidden">${formattedText}</div>`;
            chatBox.appendChild(div);
            if (scroll) scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);
        }

        // ------------------ الاتصال بـ Groq API ------------------
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            await saveMessage('user', text);
            
            // مؤشر الكتابة
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex justify-start mb-4';
            typingDiv.innerHTML = `<div class="bg-white border border-gray-100 text-green-600 px-5 py-3 rounded-2xl rounded-tr-none shadow-sm text-sm font-bold animate-pulse-fast">كيو بيفكر وبيكتب... ✨</div>`;
            chatBox.appendChild(typingDiv);
            scrollToBottom();

            try {
                // تجميع الهيستوري بدقة شديدة لتجنب خطأ 400
                let apiMessages = [{ role: "system", content: SYSTEM_PROMPT }];
                let context = [];
                
                // جلب النصوص الأصلية من خصائص الـ DOM لتجنب المسافات أو ضياع التنسيق
                const chatElements = chatBox.querySelectorAll('div[data-raw-content]');
                chatElements.forEach(el => {
                    let role = el.getAttribute('data-role');
                    let contentText = el.getAttribute('data-raw-content').trim();
                    
                    if (contentText !== "") {
                        context.push({ role: role, content: contentText });
                    }
                });
                
                apiMessages = apiMessages.concat(context.slice(-6)); // آخر 6 رسائل

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-70b-versatile", // المودل الأحدث والمستقر
                        messages: apiMessages,
                        temperature: 0.7
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Groq Error: ${response.status}`);
                }

                const data = await response.json();
                
                const indicator = document.getElementById('typing-indicator');
                if(indicator) indicator.remove();
                
                if (data.choices && data.choices[0].message) {
                    const keoReply = data.choices[0].message.content;
                    await saveMessage('keo', keoReply);
                }
            } catch (err) {
                console.error("API Error Details:", err);
                const indicator = document.getElementById('typing-indicator');
                if(indicator) indicator.remove();
                await saveMessage('keo', "معلش، حصلت مشكلة صغيرة في الشبكة أو في عقلي الإلكتروني! جرب تبعت تاني يا صاحبي. 😅");
            }
        });

        // ------------------ منطق العروض ومعاينة الكود ------------------
        function checkForCodeOrPresentation(text) {
            let hasInteractive = false;

            if (text.includes("[PRESENTATION_START]")) {
                const startIdx = text.indexOf("[PRESENTATION_START]") + 20;
                const endIdx = text.indexOf("[PRESENTATION_END]");
                if (startIdx > 19 && endIdx > startIdx) {
                    const slidesText = text.substring(startIdx, endIdx);
                    currentSlides = slidesText.split("[SLIDE_BREAK]").map(s => s.trim()).filter(s => s !== "");
                    
                    if(currentSlides.length > 0) {
                        currentSlideIndex = 0;
                        openPanel('presentation');
                        renderSlide();
                        hasInteractive = true;
                    }
                }
            }
            
            if (!hasInteractive) {
                const codeBlockMatch = text.match(/```html([\s\S]*?)```/i);
                if (codeBlockMatch && codeBlockMatch[1]) {
                    const rawHtml = codeBlockMatch[1];
                    previewIframe.srcdoc = rawHtml;
                    openPanel('code');
                    hasInteractive = true;
                }
            }
        }

        function openPanel(type) {
            interactivePanel.classList.remove('hidden', 'translate-x-full');
            interactivePanel.classList.add('flex', 'translate-x-0');
            
            tabPreview.classList.add('hidden');
            tabPresentation.classList.add('hidden');
            codePreviewContainer.classList.add('hidden');
            presentationContainer.classList.add('hidden');

            if (type === 'code') {
                tabPreview.classList.remove('hidden');
                codePreviewContainer.classList.remove('hidden');
                codePreviewContainer.classList.add('flex');
            } else if (type === 'presentation') {
                tabPresentation.classList.remove('hidden');
                presentationContainer.classList.remove('hidden');
                presentationContainer.classList.add('flex');
            }
        }

        closePanelBtn.addEventListener('click', () => {
            interactivePanel.classList.remove('translate-x-0');
            interactivePanel.classList.add('translate-x-full');
            setTimeout(() => {
                interactivePanel.classList.add('hidden');
                interactivePanel.classList.remove('flex');
            }, 300); // إغلاق سلس للموبايل
        });

        function renderSlide() {
            slideContent.style.opacity = 0;
            setTimeout(() => {
                slideContent.innerHTML = marked.parse(currentSlides[currentSlideIndex]);
                document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${currentSlides.length}`;
                
                document.getElementById('prev-slide').disabled = currentSlideIndex === 0;
                document.getElementById('next-slide').disabled = currentSlideIndex === currentSlides.length - 1;
                slideContent.style.opacity = 1;
            }, 150);
        }

        document.getElementById('prev-slide').addEventListener('click', () => {
            if (currentSlideIndex > 0) { currentSlideIndex--; renderSlide(); }
        });

        document.getElementById('next-slide').addEventListener('click', () => {
            if (currentSlideIndex < currentSlides.length - 1) { currentSlideIndex++; renderSlide(); }
        });

        // تشغيل كيو لأول مرة
        if(localMessages.length === 0) showWelcomeMessage();

    </script>
</body>
</html>
