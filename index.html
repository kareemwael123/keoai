<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeoAI - المساعد الذكي والمرح</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js لتحويل النصوص والأكواد -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0fdf4; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; direction: ltr; text-align: left;}
        .markdown-body code { font-family: monospace; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .slide-transition { transition: opacity 0.3s ease-in-out; }
        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-green-100 p-4 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <h1 class="text-3xl font-extrabold text-green-600 tracking-tight">✨ KeoAI</h1>
            <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">بواسطة كريم حسين</span>
        </div>
        <div id="auth-container">
            <!-- سيتم تحديث هذا القسم عبر الجافاسكربت بناءً على حالة تسجيل الدخول -->
            <button id="login-btn" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold transition shadow-md text-sm md:text-base flex items-center gap-2">
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                تسجيل الدخول لحفظ المحادثات
            </button>
        </div>
    </header>

    <!-- منطقة التنبيه للزوار -->
    <div id="guest-banner" class="bg-yellow-50 text-yellow-800 text-sm text-center py-2 border-b border-yellow-200 shadow-sm transition-all">
        أنت تستخدم كيو كزائر. الدردشات الحالية لن يتم حفظها إذا قمت بتحديث الصفحة. سجل الدخول لحفظها للأبد!
    </div>

    <!-- Main Content Layout -->
    <div class="flex-1 flex w-full h-full overflow-hidden relative">
        
        <!-- القسم الأيمن: الدردشة -->
        <main id="chat-section" class="flex-1 flex flex-col h-full bg-white relative transition-all duration-300 w-full lg:w-1/2 lg:border-l border-gray-200 shadow-xl z-20">
            <!-- مساحة عرض الرسائل -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-50">
                <!-- رسالة ترحيبية افتراضية -->
                <div class="flex justify-start">
                    <div class="bg-white border border-green-100 shadow-sm p-4 rounded-2xl rounded-tr-none max-w-[85%] text-gray-800 markdown-body">
                        أهلاً بيك! 👋 أنا <b>كيو (Keo)</b>، مساعدك الذكي والمرح.<br>
                        صنعني المبدع <b>كريم حسين محمدصلاح</b> عشان أساعدك في أي حاجة!<br>
                        بتحب نكتب كود، نعمل عرض تقديمي، ولا ندردش بس؟ 🚀
                    </div>
                </div>
            </div>

            <!-- منطقة الإدخال -->
            <div class="p-4 bg-white border-t border-gray-200">
                <form id="chat-form" class="flex gap-2 relative">
                    <input type="text" id="user-input" autocomplete="off" placeholder="اطلب من كيو أي شيء..." class="flex-1 bg-gray-50 p-4 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:bg-white transition-all pr-12 text-gray-800 shadow-inner">
                    <button type="submit" id="send-btn" class="bg-green-500 text-white p-4 rounded-full hover:bg-green-600 transition-colors shadow-md flex items-center justify-center min-w-[60px]">
                        <svg class="w-6 h-6 transform -rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V6m0 0l-7 7m7-7l7 7"></path></svg>
                    </button>
                </form>
            </div>
        </main>

        <!-- القسم الأيسر: العروض التفاعلية (مخفي افتراضياً) -->
        <aside id="interactive-panel" class="hidden absolute lg:relative w-full lg:w-1/2 h-full bg-slate-100 flex-col z-30 transition-transform transform translate-x-full lg:translate-x-0">
            
            <!-- هيدر الشاشة الجانبية -->
            <div class="bg-slate-800 text-white p-3 flex justify-between items-center shadow-md">
                <div class="flex gap-3">
                    <button id="tab-preview" class="px-4 py-1 rounded-full bg-blue-500 font-bold text-sm hidden">معاينة الكود 💻</button>
                    <button id="tab-presentation" class="px-4 py-1 rounded-full bg-purple-500 font-bold text-sm hidden">العرض التقديمي 📊</button>
                </div>
                <button id="close-panel" class="text-gray-300 hover:text-white p-1 bg-slate-700 rounded-full lg:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- حاوية معاينة الكود (Iframe) -->
            <div id="code-preview-container" class="flex-1 bg-white hidden w-full h-full relative">
                <iframe id="preview-iframe" class="w-full h-full border-none bg-white"></iframe>
            </div>

            <!-- حاوية العرض التقديمي -->
            <div id="presentation-container" class="flex-1 bg-gradient-to-br from-slate-900 to-slate-800 hidden flex-col justify-center items-center p-8 relative">
                <div id="slide-content" class="bg-white text-slate-900 p-10 rounded-2xl shadow-2xl w-full max-w-2xl min-h-[300px] flex flex-col justify-center text-center markdown-body text-xl slide-transition">
                    <!-- محتوى الشريحة سيظهر هنا -->
                </div>
                
                <!-- أزرار التحكم في الشرائح -->
                <div class="absolute bottom-8 flex gap-6 bg-slate-800/80 p-3 rounded-full backdrop-blur-sm border border-slate-600 shadow-lg">
                    <button id="prev-slide" class="text-white hover:text-purple-400 font-bold px-4 py-2 disabled:opacity-50">السابق ◀</button>
                    <span id="slide-counter" class="text-gray-300 font-mono font-bold flex items-center">1 / 1</span>
                    <button id="next-slide" class="text-white hover:text-purple-400 font-bold px-4 py-2 disabled:opacity-50">▶ التالي</button>
                </div>
            </div>
        </aside>

    </div>

    <!-- 스كريبتات التطبيق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyC0lwVRTBPA3yxnZ3wuqvyfQJbJP-AVNJo",
            authDomain: "kareem-8ed77.firebaseapp.com",
            databaseURL: "https://kareem-8ed77-default-rtdb.firebaseio.com",
            projectId: "kareem-8ed77",
            storageBucket: "kareem-8ed77.firebasestorage.app",
            messagingSenderId: "557227389584",
            appId: "1:557227389584:web:f8ffa9c5913ef54c919e15"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // إعدادات Groq
        const GROQ_API_KEY = "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";
        
        // System Prompt الصارم لشخصية كيو وتوجيهات الأكواد والعروض
        const SYSTEM_PROMPT = `أنت مساعد ذكي، ودود، ومرح جداً، اسمك "Keo" (كيو).
المبرمج والمطور الذي قام بصناعتك وتطويرك هو المهندس "كريم حسين محمدصلاح". 
ممنوع منعاً باتاً أن تذكر أنك مبني على LLaMA أو أن الشركة المطورة لك هي Groq أو OpenAI أو أي شركة أخرى. أنت من صنع كريم حسين وفقط.
استخدم الرموز التعبيرية (Emojis) دائماً لتكون مرحاً.

[توجيهات برمجية وعروض تقديمية - اقرأها بعناية]:
1. إذا طلب المستخدم كتابة كود لموقع (HTML/CSS/JS)، اكتب كود HTML واحد كامل يحتوي على CSS و JS بداخله. ضعه كله داخل كتلة كود (Code Block) واحدة من نوع html هكذا:
\`\`\`html
<!DOCTYPE html> ...الكود... 
\`\`\`
2. إذا طلب المستخدم "عرض تقديمي" أو "Presentation"، يجب عليك كتابته بالصيغة التالية تماماً:
ابدأ بـ [PRESENTATION_START]
ثم اكتب محتوى الشريحة الأولى، ثم ضع الفاصل [SLIDE_BREAK]
ثم الشريحة الثانية، ثم [SLIDE_BREAK]... وهكذا
في النهاية ضع [PRESENTATION_END]
لا تضع هذه العلامات إلا إذا طلب المستخدم عرضاً تقديمياً.`;

        // متغيرات الحالة
        let currentUser = null;
        let localMessages = []; // مصفوفة للزوار
        let currentSlides = [];
        let currentSlideIndex = 0;
        let unsubscribeChats = null; // لإيقاف الاستماع لقاعدة البيانات عند تسجيل الخروج

        // عناصر الواجهة
        const authContainer = document.getElementById('auth-container');
        const guestBanner = document.getElementById('guest-banner');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const interactivePanel = document.getElementById('interactive-panel');
        const tabPreview = document.getElementById('tab-preview');
        const tabPresentation = document.getElementById('tab-presentation');
        const codePreviewContainer = document.getElementById('code-preview-container');
        const presentationContainer = document.getElementById('presentation-container');
        const previewIframe = document.getElementById('preview-iframe');
        const slideContent = document.getElementById('slide-content');
        const closePanelBtn = document.getElementById('close-panel');

        // ------------------ إدارة المصادقة (Auth) ------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                guestBanner.classList.add('hidden');
                authContainer.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-semibold text-gray-700 hidden md:inline">مرحباً، ${user.displayName.split(' ')[0]}</span>
                        <img src="${user.photoURL}" alt="Profile" class="w-8 h-8 rounded-full border-2 border-green-500">
                        <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-full text-sm font-bold transition">خروج</button>
                    </div>
                `;
                document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
                
                // مسح الشات الحالي وتحميل الشات من الداتا بيس
                chatBox.innerHTML = ''; 
                loadChatsFromFirebase();
            } else {
                currentUser = null;
                guestBanner.classList.remove('hidden');
                authContainer.innerHTML = `
                    <button id="login-btn-top" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold transition shadow-md text-sm flex items-center gap-2">
                        تسجيل الدخول
                    </button>
                `;
                document.getElementById('login-btn-top').addEventListener('click', () => signInWithPopup(auth, provider));
                if (unsubscribeChats) unsubscribeChats();
                
                // إعادة رسم الرسائل المحلية إذا تم تسجيل الخروج
                chatBox.innerHTML = '';
                if(localMessages.length === 0) {
                     addMessageToUI('keo', "أهلاً بيك! 👋 أنا <b>كيو (Keo)</b>، مساعدك الذكي والمرح.<br>صنعني المبدع <b>كريم حسين محمدصلاح</b> عشان أساعدك في أي حاجة!<br>بتحب نكتب كود، نعمل عرض تقديمي، ولا ندردش بس؟ 🚀");
                } else {
                    localMessages.forEach(msg => addMessageToUI(msg.sender, msg.text, false));
                }
            }
        });

        // ------------------ الاتصال بقاعدة البيانات ------------------
        function loadChatsFromFirebase() {
            if (!currentUser) return;
            const q = query(collection(db, `users/${currentUser.uid}/chats`), orderBy('createdAt', 'asc'));
            unsubscribeChats = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = ''; // تنظيف قبل إعادة الرسم
                if(snapshot.empty) {
                     addMessageToUI('keo', "أهلاً بيك يا غالي! 👋 أنا <b>كيو</b> معاك. بحسابك المسجل ده كل شاتاتنا هتتحفظ هنا. جاهز نبرمج؟");
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    addMessageToUI(data.sender, data.text, false);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        async function saveMessage(sender, text) {
            // إضافة للواجهة فوراً والمحلية
            if (!currentUser) {
                localMessages.push({ sender, text });
                addMessageToUI(sender, text);
            } else {
                // حفظ في الداتا بيس
                addMessageToUI(sender, text); // رسم مبدئي سريع
                try {
                    await addDoc(collection(db, `users/${currentUser.uid}/chats`), {
                        sender: sender,
                        text: text,
                        createdAt: serverTimestamp()
                    });
                } catch (e) {
                    console.error("Error saving doc", e);
                }
            }
            
            // فحص المحتوى إذا كان من كيو لعرض الـ Panels
            if(sender === 'keo') {
                checkForCodeOrPresentation(text);
            }
        }

        // ------------------ واجهة الدردشة ------------------
        function addMessageToUI(sender, text, scroll = true) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-4`;
            
            let bgClass = sender === 'user' ? 'bg-green-500 text-white rounded-br-none' : 'bg-white border border-gray-200 text-gray-800 rounded-tr-none shadow-sm markdown-body';
            
            // استخدام Marked.js لتحويل المارک داون إلى HTML إذا كان من Keo
            let formattedText = sender === 'keo' ? marked.parse(text) : text;

            div.innerHTML = `<div class="p-4 rounded-2xl max-w-[90%] md:max-w-[80%] ${bgClass}">${formattedText}</div>`;
            chatBox.appendChild(div);
            if (scroll) chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ------------------ الاتصال بـ Groq API ------------------
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            await saveMessage('user', text);
            
            // إظهار مؤشر الكتابة
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex justify-start mb-4';
            typingDiv.innerHTML = `<div class="bg-gray-100 text-gray-500 p-3 rounded-2xl rounded-tr-none text-sm animate-pulse">كيو يكتب... ✨</div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // تجميع الهيستوري (آخر 5 رسائل للحفاظ على السياق)
                let apiMessages = [{ role: "system", content: SYSTEM_PROMPT }];
                
                // جلب الرسائل السابقة (من الواجهة ببساطة)
                const chatElements = chatBox.querySelectorAll('.markdown-body, .bg-green-500');
                let context = [];
                chatElements.forEach(el => {
                    let role = el.classList.contains('bg-green-500') ? 'user' : 'assistant';
                    context.push({ role: role, content: el.innerText });
                });
                
                // إضافة آخر رسائل
                apiMessages = apiMessages.concat(context.slice(-6)); 

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192", 
                        messages: apiMessages,
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                document.getElementById('typing-indicator').remove();
                
                if (data.choices && data.choices[0].message) {
                    const keoReply = data.choices[0].message.content;
                    await saveMessage('keo', keoReply);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('typing-indicator').remove();
                await saveMessage('keo', "عذراً، حصلت مشكلة في الاتصال بعقلي الإلكتروني! جرب تاني يا صديقي. 😅");
            }
        });

        // ------------------ منطق معاينة الكود والعروض التقديمية ------------------
        function checkForCodeOrPresentation(text) {
            let hasInteractive = false;

            // 1. فحص العروض التقديمية
            if (text.includes("[PRESENTATION_START]")) {
                const startIdx = text.indexOf("[PRESENTATION_START]") + 20;
                const endIdx = text.indexOf("[PRESENTATION_END]");
                if (startIdx > 19 && endIdx > startIdx) {
                    const slidesText = text.substring(startIdx, endIdx);
                    currentSlides = slidesText.split("[SLIDE_BREAK]").map(s => s.trim()).filter(s => s !== "");
                    
                    if(currentSlides.length > 0) {
                        currentSlideIndex = 0;
                        openPanel('presentation');
                        renderSlide();
                        hasInteractive = true;
                    }
                }
            }
            
            // 2. فحص الأكواد (HTML) إذا لم يكن عرضاً تقديمياً
            if (!hasInteractive) {
                const codeBlockMatch = text.match(/```html([\s\S]*?)```/i);
                if (codeBlockMatch && codeBlockMatch[1]) {
                    const rawHtml = codeBlockMatch[1];
                    previewIframe.srcdoc = rawHtml;
                    openPanel('code');
                    hasInteractive = true;
                }
            }
        }

        // التحكم بالشاشة الجانبية
        function openPanel(type) {
            interactivePanel.classList.remove('hidden', 'translate-x-full');
            interactivePanel.classList.add('flex', 'translate-x-0'); // للموبايل أنيمشن
            
            tabPreview.classList.add('hidden');
            tabPresentation.classList.add('hidden');
            codePreviewContainer.classList.add('hidden');
            presentationContainer.classList.add('hidden');

            if (type === 'code') {
                tabPreview.classList.remove('hidden');
                codePreviewContainer.classList.remove('hidden');
                codePreviewContainer.classList.add('flex');
            } else if (type === 'presentation') {
                tabPresentation.classList.remove('hidden');
                presentationContainer.classList.remove('hidden');
                presentationContainer.classList.add('flex');
            }
        }

        closePanelBtn.addEventListener('click', () => {
            interactivePanel.classList.add('hidden', 'translate-x-full');
        });

        // منطق أزرار العرض التقديمي
        function renderSlide() {
            slideContent.innerHTML = marked.parse(currentSlides[currentSlideIndex]);
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${currentSlides.length}`;
            
            document.getElementById('prev-slide').disabled = currentSlideIndex === 0;
            document.getElementById('next-slide').disabled = currentSlideIndex === currentSlides.length - 1;
        }

        document.getElementById('prev-slide').addEventListener('click', () => {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide();
            }
        });

        document.getElementById('next-slide').addEventListener('click', () => {
            if (currentSlideIndex < currentSlides.length - 1) {
                currentSlideIndex++;
                renderSlide();
            }
        });

    </script>
</body>
</html>
